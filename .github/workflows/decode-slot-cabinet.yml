name: Decode slot cabinet JPEG
on:
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          src = pathlib.Path("assets/slot_cabinet.jpg.b64")
          dest = pathlib.Path("assets/slot_cabinet.jpg")
          data = base64.b64decode(src.read_text().strip())
          if data[:3] != b"\xff\xd8\xff":
              raise SystemExit("decoded payload is not a JPEG")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(data)
          src.unlink()
          print("wrote", dest, "bytes", len(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/slot_cabinet.jpg
          git rm -f assets/slot_cabinet.jpg.b64
          git commit -m "Add assets/slot_cabinet.jpg"
          git push
