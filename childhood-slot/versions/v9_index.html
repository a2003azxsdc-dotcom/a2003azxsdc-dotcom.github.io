<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>童年課堂紙條造句 × AI生圖</title>
  <style>
:root {
  --gold: #ffd764;
  --gold-2: #f0b429;
  --led: #fff4c0;
  --cyan: #3ef0ff;
  --text: #fff8ec;
  --muted: #d2c0a8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: #07050a;
  color: var(--text);
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}
body {
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  overflow: hidden;
}
.app-wrap, .machine { align-self: flex-start; margin-top: 0; }
button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; border: none; background: none; color: inherit; }
.sr-only, .visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);
}
.hidden { display: none !important; }

.app-wrap {
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  max-width: none;
  margin: 0;
  padding: 0 0 env(safe-area-inset-bottom, 0px);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow: hidden;
  overflow-x: hidden;
  container-type: size;
}
.machine {
  position: relative;
  box-sizing: border-box;
  aspect-ratio: 1536 / 2752;
  width: 100%;
  max-width: 480px;
  height: auto;
  font-size: clamp(10px, 3.15vw, 15px);
  overflow: hidden;
  background: #000;
  box-shadow: 0 8px 28px rgba(0,0,0,0.55);
  flex: 0 0 auto;
  align-self: flex-start;
  margin-top: 0;
}
@supports (width: 1cqh) {
  .machine {
    width: min(100cqw, calc(100cqh * 1536 / 2752), 480px);
    max-width: 100%;
    max-height: 100%;
    font-size: clamp(10px, 3.15cqi, 15px);
  }
}
html.cabinet-scroll,
html.cabinet-scroll body {
  overflow: hidden;
}
html.cabinet-scroll .app-wrap {
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: none;
}
html.cabinet-scroll .machine {
  max-width: none;
  max-height: none;
}
@supports (width: 1cqh) {
  html.cabinet-scroll .machine {
    width: 100%;
    max-width: 100%;
    max-height: none;
    height: auto;
    font-size: clamp(10px, 3.15cqi, 15px);
  }
}
.cabinet-art {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}
.zone { position: absolute; z-index: 2; }
.debug .zone { outline: 1px solid rgba(0,255,255,0.85); }

.icon-btn {
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 1.02em;
  line-height: 1;
  font-weight: 900;
  letter-spacing: 0.02em;
  color: #1b1d22;
  background: radial-gradient(circle at 35% 30%, #fff, #c9d0d8 48%, #6a727a);
  box-shadow: 0 2px 0 #2c3034, inset 0 1px 0 #fff, 0 0 8px rgba(255,210,80,0.35);
  z-index: 12;
  text-shadow: 0 1px 0 #fff;
}
.icon-btn[aria-pressed="true"] { color: #7a1020; filter: grayscale(0.4); }

.zone-marquee {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(180deg, rgba(4,2,10,0.55) 0%, rgba(4,2,10,0.28) 70%, rgba(4,2,10,0.08) 100%);
}
.mq-bulbs { display: flex; justify-content: space-between; height: 12%; padding: 0 3%; flex-shrink: 0; }
.mq-bulbs i {
  width: 5px; height: 5px; border-radius: 50%;
  background: #fff6c0;
  box-shadow: 0 0 5px #ffd764;
  animation: chase-bulb 0.9s linear infinite;
  align-self: center;
}
@keyframes chase-bulb {
  0%, 14% { opacity: 1; filter: brightness(1.8); transform: scale(1.15); }
  24%, 100% { opacity: 0.3; filter: brightness(0.55); transform: scale(0.9); }
}
.marquee-box { flex: 1; overflow: hidden; position: relative; min-height: 0; }
.marquee-track {
  display: flex; width: max-content; height: 100%;
  align-items: center;
  animation: marquee 16s linear infinite;
  white-space: nowrap;
}
.marquee-track span {
  padding: 0 1.6em;
  font-size: 0.92em;
  font-weight: 900;
  color: var(--cyan);
  text-shadow: 0 0 6px #3ef0ff, 0 0 12px rgba(62,240,255,0.8);
  animation: neon-flicker 6s ease-in-out infinite;
}
.marquee-track span:nth-child(even) {
  color: #ffe07a;
  text-shadow: 0 0 6px #ffd764, 0 0 12px rgba(255,215,100,0.8);
  animation-delay: 1.4s;
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes neon-flicker {
  0%, 92%, 100% { opacity: 1; }
  93% { opacity: 0.4; }
  95% { opacity: 1; }
  96% { opacity: 0.25; }
  97.5% { opacity: 1; }
}

.zone-lcd, .zone-history {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.4s ease, visibility 0.4s;
}
.zone-lcd.is-revealed, .zone-history.is-revealed {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.zone-lcd {
  background: rgba(6, 4, 16, 0.82);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  box-shadow: inset 0 0 14px rgba(0,0,0,0.55), 0 0 10px rgba(255, 180, 40, 0.2);
  border: 1px solid rgba(255, 215, 100, 0.38);
  color: var(--led);
  display: flex;
  flex-direction: column;
  padding: 2% 3% 1.8%;
  overflow: hidden;
  border-radius: 5px;
}
.lcd-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 4px; flex-shrink: 0; margin-bottom: 2%;
}
.lcd-tag {
  font-size: 0.62em; font-weight: 800; letter-spacing: 0.12em;
  color: var(--gold); text-shadow: 0 0 6px rgba(255,200,60,0.5);
}
.btn-copy {
  background: linear-gradient(180deg, #3a3a22, #1a180c);
  color: var(--gold);
  border: 1px solid var(--gold-2);
  padding: 0.15em 0.45em;
  font-size: 0.62em;
  font-weight: 800;
  border-radius: 3px;
  white-space: nowrap;
}
.btn-copy.copied { color: #9dffb0; border-color: #3d8; }
#sentence {
  flex: 1;
  font-size: 0.78em;
  font-weight: 800;
  line-height: 1.3;
  overflow: auto;
  min-height: 0;
  text-shadow: 0 0 6px rgba(255, 227, 140, 0.35);
}
#sentence .hl {
  color: #fffce8;
  background: rgba(255, 70, 70, 0.28);
  padding: 0 0.1em;
  border-radius: 2px;
}
.lcd-preview {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0.28; pointer-events: none;
}
.zone-lcd.has-img #sentence, .zone-lcd.has-img .lcd-top { position: relative; z-index: 1; }
.lcd-loading {
  position: absolute; inset: 0; z-index: 2;
  background: rgba(0,0,0,0.78);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0.4em;
  font-size: 0.72em; font-weight: 800; color: var(--gold);
}
.spinner {
  width: 1.4em; height: 1.4em;
  border: 2px solid rgba(255,211,90,0.25);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.reel-window {
  overflow: hidden;
  background: linear-gradient(180deg, #f8f8fc, #d0d1d8 55%, #b9bac4);
  box-shadow: inset 0 6px 10px rgba(0,0,0,0.38), inset 0 -5px 8px rgba(0,0,0,0.3);
  border-radius: 3px;
}
.reel-window::before {
  content: "";
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg,
    rgba(0,0,0,0.38) 0%,
    rgba(0,0,0,0.10) 12%,
    rgba(255,255,255,0.22) 28%,
    transparent 42%,
    transparent 58%,
    rgba(255,255,255,0.12) 74%,
    rgba(0,0,0,0.12) 88%,
    rgba(0,0,0,0.38) 100%);
}
.reel-window::after {
  content: "";
  position: absolute; left: 0; right: 0; top: 0; height: 30%;
  z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,0.38), transparent);
}
.reel-strip { will-change: transform; position: relative; z-index: 1; }
.reel-window.spinning .reel-strip { filter: blur(4px) contrast(1.05) saturate(1.08); }
.reel-item {
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #fcfcff 0%, #e8e8f0 42%, #c5c6d0 100%);
  box-shadow: inset 0 -1px 0 rgba(0,0,0,0.14), inset 0 1px 0 rgba(255,255,255,0.75);
}
.reel-item svg {
  width: 86%; height: 86%; display: block;
  filter: drop-shadow(0 3px 2px rgba(0,0,0,0.45)) drop-shadow(0 0 3px rgba(255,220,80,0.25));
}
.reel-window.landed {
  box-shadow: inset 0 0 16px rgba(255, 210, 70, 0.45), inset 0 4px 8px rgba(0,0,0,0.3);
}

.slot-knob, .slot-btn {
  border-radius: 50%;
  background: transparent;
  z-index: 4;
  position: absolute;
}
.slot-btn.next-step::before, .slot-knob.next-step::before {
  content: "";
  position: absolute;
  inset: -22%;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 0 10px 3px rgba(255, 40, 50, 0.85), 0 0 22px 8px rgba(255, 80, 80, 0.45);
  animation: ring-pulse 0.7s ease-in-out infinite;
  pointer-events: none;
}
.slot-knob.next-step::before {
  border-color: #fff6c8;
  box-shadow: 0 0 10px 3px rgba(255, 200, 50, 0.8), 0 0 20px 7px rgba(255, 180, 40, 0.4);
}
.slot-btn.next-step, .slot-knob.next-step {
  animation: btn-bounce 0.7s ease-in-out infinite;
}
@keyframes ring-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.12); opacity: 0.65; }
}
@keyframes btn-bounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6%) scale(1.06); }
}
.slot-btn.is-locked::after, .slot-knob.is-locked::after {
  content: "";
  position: absolute;
  inset: -8%;
  border-radius: 50%;
  background: rgba(0,0,0,0.48);
  pointer-events: none;
}
.slot-knob:disabled, .slot-btn:disabled { cursor: default; }
.slot-btn.is-locked, .slot-knob.is-locked { cursor: not-allowed; }

.speech-bubble {
  position: absolute;
  z-index: 6;
  display: none;
  top: 61%;
  background: #fffdf6;
  color: #1a0a0a;
  font-weight: 900;
  font-size: 0.78em;
  line-height: 1.25;
  padding: 0.4em 0.62em;
  border-radius: 0.85em;
  border: 2px solid #1a1a1a;
  box-shadow: 0 3px 0 #000, 0 6px 14px rgba(0,0,0,0.4);
  white-space: nowrap;
  pointer-events: none;
  text-align: center;
  transform: translateX(-50%);
}
.speech-bubble[data-bubble-step="1"] { left: 36.95%; }
.speech-bubble[data-bubble-step="2"] { left: 50.46%; }
.speech-bubble[data-bubble-step="3"] { left: 63.96%; }
.speech-bubble.is-on { display: block; animation: bubble-cycle 5s ease-in-out infinite; }
.speech-bubble::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -8px;
  margin-left: -8px;
  border: 8px solid transparent;
  border-top-color: #fffdf6;
  filter: drop-shadow(0 2px 0 #000);
}
@keyframes bubble-cycle {
  0% { opacity: 0; transform: translateX(-50%) scale(0.7); }
  6% { opacity: 1; transform: translateX(-50%) scale(1); }
  14% { transform: translateX(-50%) translateY(-3px); }
  22% { transform: translateX(-50%) translateY(0); }
  30% { transform: translateX(-50%) translateY(-3px); }
  38% { transform: translateX(-50%) translateY(0); }
  46% { transform: translateX(-50%) translateY(-3px); }
  54% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  60% { opacity: 1; transform: translateX(-50%) scale(1); }
  68% { opacity: 0; transform: translateX(-50%) scale(0.85); }
  100% { opacity: 0; transform: translateX(-50%) scale(0.85); }
}
.skip-upload {
  position: absolute;
  z-index: 6;
  font-size: 0.58em;
  font-weight: 800;
  color: #ffe08a;
  text-decoration: underline;
  text-shadow: 0 1px 2px #000;
  background: rgba(0,0,0,0.45);
  padding: 0.2em 0.45em;
  border-radius: 4px;
}
.skip-upload.hidden { display: none !important; }

.upload-preview {
  position: absolute;
  z-index: 5;
  display: none;
  align-items: center;
  gap: 4px;
  background: rgba(0,0,0,0.72);
  border: 1px solid var(--gold);
  border-radius: 4px;
  padding: 3px 5px;
  font-size: 0.58em;
}
.upload-preview.show { display: flex; }
.upload-preview img { width: 1.6em; height: 1.6em; object-fit: cover; border: 1px solid var(--gold); }
.upload-preview .meta b { color: #9dffb0; display: block; }
.upload-preview .meta span { color: var(--muted); max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.linkish { background: none; color: #ff8a8a; font-size: 1em; font-weight: 700; padding: 2px; }

.zone-history {
  background: rgba(6, 4, 12, 0.82);
  box-shadow: inset 0 0 16px rgba(0,0,0,0.5);
  padding: 2.2% 2.4%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.history-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.68em; font-weight: 800; color: var(--gold);
  letter-spacing: 0.12em; margin-bottom: 2%; flex-shrink: 0;
}
.history-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 3px;
  overflow: auto;
  min-height: 0;
  align-content: start;
}
.history-grid .empty-h, .hint {
  grid-column: 1 / -1;
  text-align: center;
  color: #e8dcc8;
  font-size: 0.78em;
  font-weight: 700;
  line-height: 1.45;
  padding: 0.4em 0.6em;
}
.thumb {
  aspect-ratio: 9/16;
  border: 1px solid #8a9098;
  overflow: hidden;
  background: #111;
  cursor: pointer;
  padding: 0;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:focus, .thumb:hover { outline: 2px solid var(--gold); }

.fx-layer {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 18;
}
.jackpot-banner {
  position: absolute;
  left: 10%; top: 40.4%;
  width: 80%;
  z-index: 19;
  pointer-events: none;
  text-align: center;
  font-weight: 900;
  font-size: 1.15em;
  letter-spacing: 0.12em;
  color: #fff8d0;
  text-shadow: 0 0 8px #ffd24a, 0 0 18px #ff4a2a, 0 2px 0 #7a2000;
  opacity: 0;
  transform: scale(0.6);
}
.jackpot-banner.show { animation: jackpot-pop 4.2s ease forwards; }
@keyframes jackpot-pop {
  0% { opacity: 0; transform: scale(0.5); }
  8% { opacity: 1; transform: scale(1.12); }
  16% { transform: scale(1); }
  22%, 30% { opacity: 1; }
  26% { opacity: 0.55; }
  70% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.05); }
}
.machine.is-jackpot .reel-window {
  box-shadow: inset 0 0 18px rgba(255,220,80,0.7), 0 0 16px rgba(255,200,40,0.8);
  animation: reel-flash 0.18s steps(2) infinite;
}
.machine.is-jackpot .zone-marquee {
  box-shadow: 0 0 22px rgba(255, 80, 60, 0.55), inset 0 0 16px rgba(255, 210, 80, 0.25);
}
@keyframes reel-flash {
  0% { filter: brightness(1); }
  50% { filter: brightness(1.35); }
}
.machine.is-jackpot::after {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 17;
  animation: cab-flash 0.22s steps(2) infinite;
  background: radial-gradient(ellipse at 50% 48%, rgba(255,220,80,0.16), transparent 55%);
}
@keyframes cab-flash {
  0% { opacity: 0.35; }
  50% { opacity: 0.9; }
}

#toast {
  position: fixed; left: 50%; bottom: 20px;
  transform: translateX(-50%) translateY(16px);
  background: #1a1210; color: #fff;
  border: 1px solid var(--gold);
  padding: 10px 14px; font-size: 13px; font-weight: 700;
  z-index: 80; max-width: 90vw; opacity: 0; pointer-events: none;
  transition: 0.25s; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.92); z-index: 90;
  padding: 16px; flex-direction: column;
  align-items: center; justify-content: center;
}
#lightbox.show { display: flex; }
#lightbox img { max-width: 100%; max-height: 78dvh; object-fit: contain; }
#lightbox .cap { color: var(--led); font-size: 13px; font-weight: 700; margin-top: 10px; text-align: center; max-width: 36em; }
#lightbox .x {
  position: absolute; top: 10px; right: 10px;
  width: 40px; height: 40px; border-radius: 50%;
  background: #fff; color: #000; font-size: 20px; font-weight: 900;
}

#admin {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.76); z-index: 70;
  overflow: auto; padding: 12px 8px 24px;
}
#admin.show { display: block; }
.admin-card {
  width: 100%; max-width: 440px; margin: 0 auto;
  background: linear-gradient(180deg, #241018, #161016);
  border: 2px solid #b8860b; border-radius: 12px; padding: 16px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.65);
}
.admin-card h2 { font-size: 17px; color: var(--gold); margin-bottom: 8px; }
.admin-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
.admin-row select, .admin-row input, .admin-card textarea, .field input, .field textarea {
  background: #0c0a0e; color: var(--text); border: 1px solid #5a5050;
  padding: 8px 10px; font-size: 13px; border-radius: 6px; width: 100%;
}
.admin-row select { flex: 1; min-width: 140px; }
.mini {
  background: #2a2428; color: #fff; border: 1px solid #6a6060;
  padding: 7px 10px; font-size: 12px; font-weight: 800; border-radius: 5px;
}
.mini.gold { background: #5a4010; border-color: var(--gold); color: var(--gold); }
.mini.danger { background: #4a1010; border-color: #f66; color: #f88; }
.tabs { display: flex; gap: 4px; margin: 8px 0; }
.tabs button {
  flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800;
  background: #2a2024; color: var(--muted); border-bottom: 2px solid transparent;
}
.tabs button.on { color: var(--gold); border-bottom-color: var(--gold); background: #3a2820; }
.entry-list { max-height: 280px; overflow: auto; display: grid; gap: 6px; }
.entry { background: #0e0c10; border: 1px solid #3a3438; padding: 8px; font-size: 12px; border-radius: 4px; }
.entry b { display: block; font-size: 13px; margin-bottom: 2px; }
.entry .en { color: var(--muted); line-height: 1.4; word-break: break-word; }
.entry .row { display: flex; gap: 6px; margin-top: 6px; }
.field { display: grid; gap: 4px; margin-top: 8px; }
.field label { font-size: 11px; color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c8"/><stop offset="0.4" stop-color="#ffd24a"/><stop offset="1" stop-color="#b07a10"/></linearGradient>
    <linearGradient id="gRed7" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#ff6a6a"/><stop offset="0.45" stop-color="#e01018"/><stop offset="1" stop-color="#7a0008"/></linearGradient>
    <linearGradient id="gCherry" x1="0.3" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ff5a63"/><stop offset="0.5" stop-color="#c00818"/><stop offset="1" stop-color="#6a0010"/></linearGradient>

  (function () {
    var AR = 1536 / 2752, MAX_W = 480, PHONE_W = 600, lastW = 0, lastH = 0, lastScroll = null;
    function avail() {
      var wrap = document.querySelector(".app-wrap"), vv = window.visualViewport;
      var iw = document.documentElement.clientWidth || window.innerWidth || 0;
      var ih = document.documentElement.clientHeight || window.innerHeight || 0;
      if (vv) { if (vv.width) iw = Math.min(iw || vv.width, vv.width); if (vv.height) ih = Math.min(ih || vv.height, vv.height); }
      var w = (wrap && wrap.clientWidth >= 2) ? wrap.clientWidth : iw;
      var h = (wrap && wrap.clientHeight >= 2) ? wrap.clientHeight : ih;
      if (ih && h > ih + 1) h = ih;
      if (iw && w > iw + 1) w = iw;
      return { w: w || 390, h: h || 640 };
    }
    function fitCabinetToViewport() {
      var m = document.getElementById("machine");
      if (!m) return;
      var a = avail(), phone = a.w <= PHONE_W, fillH = a.w / AR, scroll = !!(phone && fillH > a.h + 0.5);
      document.documentElement.classList.toggle("cabinet-scroll", scroll);
      var w, h;
      if (scroll) { a = avail(); w = a.w; h = w / AR; }
      else {
        w = Math.min(a.w, MAX_W); h = w / AR;
        if (h > a.h) { h = a.h; w = h * AR; }
        if (w > a.w) { w = a.w; h = w / AR; }
      }
      w = Math.max(1, Math.floor(w)); h = Math.max(1, Math.round(w / AR));
      if (!scroll && h > a.h) { h = Math.max(1, Math.floor(a.h)); w = Math.max(1, Math.round(h * AR)); }
      if (w === lastW && h === lastH && lastScroll === scroll) return;
      lastW = w; lastH = h; lastScroll = scroll;
      m.style.width = w + "px"; m.style.height = h + "px"; m.style.maxWidth = "none"; m.style.maxHeight = "none";
      m.style.fontSize = Math.max(10, Math.min(15, w * 0.0315)) + "px";
    }
    window.fitCabinetToViewport = fitCabinetToViewport;
    window.addEventListener("resize", fitCabinetToViewport);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fitCabinetToViewport);
    document.addEventListener("DOMContentLoaded", fitCabinetToViewport);
  })();

const AudioEng = {
  ctx: null, muted: false, unlocked: false, bgTimer: null, master: null, bgGain: null, sfxGain: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
    this.bgGain = this.ctx.createGain(); this.bgGain.gain.value = 0.18; this.bgGain.connect(this.master);
    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.42; this.sfxGain.connect(this.master);
  },
  async unlock() {
    this.init();
    if (!this.ctx) return;
    if (this.ctx.state === "suspended") { try { await this.ctx.resume(); } catch (e) {} }
    this.unlocked = true;
    if (!this.muted) this.startBGM();
    this.syncMuteBtn();
  },
  syncMuteBtn() {
    const btn = $("btn-mute"); if (!btn) return;
    btn.setAttribute("aria-pressed", this.muted ? "true" : "false");
    btn.textContent = this.muted ? "✕" : "♪";
  },
  setMuted(m) {
    this.muted = !!m;
    if (this.master) this.master.gain.value = this.muted ? 0 : 1;
    this.syncMuteBtn();
    if (!this.muted && this.unlocked) this.startBGM();
    if (this.muted) this.stopBGM();
  },
  toggleMute() { this.setMuted(!this.muted); },
  osc(type, freq, dur, gain, dest, at, slide) {
    if (!this.ctx || this.muted) return;
    const t = at != null ? at : this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxGain); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, gain, dest, at, freq, type, Q) {
    if (!this.ctx || this.muted) return;
    const t = at != null ? at : this.ctx.currentTime, n = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, Math.max(1, Math.floor(n * dur)), n), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = type || "bandpass"; f.frequency.value = freq || 1800; f.Q.value = Q || 1.2;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest || this.sfxGain); src.start(t); src.stop(t + dur + 0.02);
  },
  startWhoosh() { this.noise(0.22, 0.55, this.sfxGain, null, 400, "lowpass", 0.7); this.osc("sawtooth", 140, 0.28, 0.28, this.sfxGain, null, 520); },
  tick() { this.noise(0.014, 0.16, this.sfxGain, null, 2600, "bandpass", 1.4); },
  clunk(i) { const base = 150 - (i || 0) * 18; this.osc("sine", base, 0.22, 0.7, this.sfxGain, null, 48); this.noise(0.07, 0.45, this.sfxGain, null, 700, "lowpass", 0.8); },
  jackpot() {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) => this.osc("square", f, 0.18, 0.14, this.sfxGain, t0 + i * 0.07));
  },
  startBGM() {
    if (!this.ctx || this.muted || this.bgTimer) return;
    const tempo = 0.2, melody = [[0,392],[1,493.88],[2,587.33],[3,493.88],[4,392],[5,440],[6,523.25],[7,440]];
    const sched = () => { if (this.ctx && !this.muted) { const t0 = this.ctx.currentTime + 0.02; melody.forEach(([i, f]) => this.osc("square", f, 0.16, 0.05, this.bgGain, t0 + i * tempo)); } };
    sched(); this.bgTimer = setInterval(sched, 8 * tempo * 1000);
  },
  stopBGM() { if (this.bgTimer) { clearInterval(this.bgTimer); this.bgTimer = null; } }
};

function startTicks(ms) { stopTicks(); tickIntervalMs = ms; const loop = () => { AudioEng.tick(); tickTimer = setTimeout(loop, tickIntervalMs); }; loop(); }

const SYMBOLS = ["seven","bar","bar2","bar3","cherry","bell","lemon","grape","melon","star","diamond","orange"];
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function measureItemH() { const vp = $("viewport-outfit"); return vp ? Math.max(24, Math.round(vp.getBoundingClientRect().height)) : 96; }
function initReels() {
  ITEM_H = measureItemH();
  ["outfit", "location", "action"].forEach(key => {
    const el = $("strip-" + key), items = shuffle(SYMBOLS);
    reels[key] = { el, offset: 0, speed: 0, spinning: false, raf: 0, items, total: 0, cycle: 0 };
    buildStrip(key);
    snapReelTo(key, (state.currentSymbols && state.currentSymbols[key]) || items[0]);
  });
}
function snapReelTo(key, symbolId) {
  const r = reels[key]; if (!r) return;
  let idx = Math.max(0, r.items.indexOf(symbolId));
  const dest = idx * ITEM_H + ITEM_H * r.cycle * 2;
  r.offset = dest; r.el.style.transform = "translateY(" + (-dest) + "px)";
  r.el.parentElement.classList.add("landed"); r.el.parentElement.classList.remove("spinning");
}
function buildStrip(key) {
  const r = reels[key], items = r.items; r.el.innerHTML = "";
  const copies = Math.max(14, Math.ceil(48 / items.length));
  for (let c = 0; c < copies; c++) {
    items.forEach(id => {
      const d = document.createElement("div"); d.className = "reel-item"; d.style.height = ITEM_H + "px";
      d.innerHTML = '<svg viewBox="0 0 100 100"><use href="#sym-' + id + '"></use></svg>';
      r.el.appendChild(d);
    });
  }
  r.total = items.length * copies; r.cycle = items.length;
}
function startReelSpin(key) {
  const r = reels[key]; r.spinning = true; r.speed = 2600 + Math.random() * 500;
  r.el.parentElement.classList.add("spinning"); r.el.parentElement.classList.remove("landed");
  let last = performance.now();
  const loop = now => {
    if (!r.spinning) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    r.offset = (r.offset + r.speed * dt) % (ITEM_H * r.total);
    r.el.style.transform = "translateY(" + (-r.offset) + "px)";
    r.raf = requestAnimationFrame(loop);
  };
  r.raf = requestAnimationFrame(loop);
}
function stopReel(key, symbolId) {
  return new Promise(resolve => {
    const r = reels[key]; r.spinning = false; if (r.raf) cancelAnimationFrame(r.raf);
    r.el.parentElement.classList.remove("spinning");
    let idx = Math.max(0, r.items.indexOf(symbolId)), loopOne = ITEM_H * r.cycle, current = r.offset, dest = idx * ITEM_H;
    while (dest < current + loopOne * 0.45) dest += loopOne;
    if (dest > ITEM_H * (r.total - 1)) dest = idx * ITEM_H + loopOne * 2;
    const start = current, dist = dest - start, dur = 560, t0 = performance.now();
    const ease = t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
    const anim = now => {
      const t = Math.min(1, (now - t0) / dur);
      r.offset = start + dist * ease(t); r.el.style.transform = "translateY(" + (-r.offset) + "px)";
      if (t < 1) requestAnimationFrame(anim);
      else { r.offset = dest; r.el.style.transform = "translateY(" + (-dest) + "px)"; r.el.parentElement.classList.add("landed"); resolve(); }
    };
    requestAnimationFrame(anim);
  });
}

function setStep(n) {

  document.querySelectorAll("[data-step]").forEach(el => {
    const s = Number(el.getAttribute("data-step"));
    el.classList.toggle("next-step", s === n); el.classList.toggle("is-idle", s !== n);
  });
  document.querySelectorAll(".speech-bubble").forEach(el => el.classList.toggle("is-on", Number(el.getAttribute("data-bubble-step")) === n));
  const ready = canvasReadyToSpin(), spinOn = n === 2 && ready;
  if ($("btn-knob")) { $("btn-knob").classList.toggle("next-step", spinOn); $("btn-knob").classList.toggle("is-locked", !ready); }
  if ($("btn-spin-step")) { $("btn-spin-step").classList.toggle("next-step", spinOn); $("btn-spin-step").classList.toggle("is-idle", !spinOn); $("btn-spin-step").classList.toggle("is-locked", !ready); }
  if ($("btn-skip-upload")) $("btn-skip-upload").classList.toggle("hidden", ready || n !== 1);

async function triggerSpin() {
  if (state.isSpinning || state.isGenerating) return;
  const p = activeProject();
  if (!canvasReadyToSpin()) { showToast("請先上傳照片，或點「略過上傳」"); return; }

  await AudioEng.unlock();
  state.isSpinning = true; setStep(2); setSpinEnabled(false);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  state.current = { outfit: pick(p.outfits), location: pick(p.locations), action: pick(p.actions) };
  state.currentSymbols = { outfit: "seven", location: "seven", action: "seven" };

  AudioEng.startWhoosh();
  ["outfit", "location", "action"].forEach(startReelSpin);
  startTicks(46);
  await delay(1400); await stopReel("outfit", "seven"); AudioEng.clunk(0); tickIntervalMs = 90;
  await delay(900); await stopReel("location", "seven"); AudioEng.clunk(1); tickIntervalMs = 150;
  await delay(900); await stopReel("action", "seven"); AudioEng.clunk(2); stopTicks();
  AudioEng.jackpot(); JackpotFX.start();

  buildOutputs(); showLcd(true);
  state.isSpinning = false; setSpinEnabled(true); setStep(3);
  generateAIImage();
}

/* ---------- 免 API Key 即時生圖引擎 ---------- */
function generateAIImage() {
  if (state.isGenerating || state.isSpinning || !state.currentPrompt) return;
  state.isGenerating = true;
  setPreview("loading");

  const seed = Math.floor(Math.random() * 9999999);
  const encodedPrompt = encodeURIComponent(state.currentPrompt);
  const imgUrl = "https://image.pollinations.ai/prompt/" + encodedPrompt + "?width=720&height=1280&seed=" + seed + "&nologo=true&model=flux";

  const loader = new Image();
  loader.crossOrigin = "anonymous";
  loader.onload = () => {
    let finalUrl = imgUrl;
    try {
      const c = document.createElement("canvas");
      c.width = 720; c.height = 1280;
      c.getContext("2d").drawImage(loader, 0, 0, 720, 1280);
      finalUrl = c.toDataURL("image/jpeg", 0.85);
    } catch (e) {}
    setPreview("image", finalUrl);
    state.history.unshift({ url: finalUrl, title: state.currentSentence });
    saveHistory();
    renderHistory();
    state.isGenerating = false;
    setStep(2);
    showToast("🎉 AI 實圖生成完成！");
  };
  loader.onerror = () => {
    setPreview("none");
    state.isGenerating = false;
    setStep(2);
    showToast("連線逾時，請再拉桿一次重試");
  };
  loader.src = imgUrl;
}

function setPreview(mode, url) {
  $("preview-loading").classList.toggle("hidden", mode !== "loading");
  const img = $("preview-image"), lcd = document.querySelector(".zone-lcd");
  if (mode === "image" && url) { img.src = url; img.classList.remove("hidden"); lcd.classList.add("has-img"); }
  else { img.classList.add("hidden"); lcd.classList.remove("has-img"); }
}

function renderHistory() {
  syncHistoryWall();
  const box = $("history-grid"); box.innerHTML = "";
  state.history.forEach(item => {
    const b = document.createElement("button"); b.type = "button"; b.className = "thumb";
    const im = document.createElement("img"); im.src = item.url; im.alt = item.title || "";
    b.appendChild(im); b.addEventListener("click", () => { $("lightbox-img").src = item.url; $("lightbox-cap").textContent = item.title || ""; $("lightbox").classList.add("show"); });

function handleImageUpload(e) {

  const reader = new FileReader();
  reader.onload = ev => {
    state.uploadedImageBase64 = ev.target.result; state.uploadedFileName = file.name;
    $("user-image-preview").src = state.uploadedImageBase64; $("upload-filename").textContent = file.name;

    showToast("照片載入成功！已鎖定五官");
    if (!state.isSpinning && !state.isGenerating) setStep(2);
  };
  reader.readAsDataURL(file);
}

  };
  $("btn-reset-banks").onclick = () => { if (confirm("還原預設詞庫？")) { const p = activeProject(); p.outfits = clone(DEFAULT_BANKS.outfits); p.locations = clone(DEFAULT_BANKS.locations); p.actions = clone(DEFAULT_BANKS.actions); saveProjects(); renderAdmin(); initReels(); } };
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { state.adminTab = b.getAttribute("data-tab"); state.editingIndex = -1; renderEntryList(); });
  $("btn-save-entry").onclick = () => {
    const name = $("entry-name").value.trim(), prompt = $("entry-prompt").value.trim();
    if (!name || !prompt) return;
    const arr = activeProject()[state.adminTab];
    if (state.editingIndex >= 0) arr[state.editingIndex] = { name, prompt }; else arr.push({ name, prompt });
    state.editingIndex = -1; $("entry-name").value = ""; $("entry-prompt").value = ""; $("btn-save-entry").textContent = "新增";
    saveProjects(); renderEntryList(); showToast("已儲存");
  };
  $("btn-cancel-entry").onclick = () => { state.editingIndex = -1; $("entry-name").value = ""; $("entry-prompt").value = ""; $("btn-save-entry").textContent = "新增"; };
  $("btn-mute").onclick = async () => { await AudioEng.unlock(); AudioEng.toggleMute(); showToast(AudioEng.muted ? "已靜音" : "已開啟聲音"); };
}

document.addEventListener("DOMContentLoaded", () => {
  window.fitCabinetToViewport?.();
  loadStore(); bindUI(); initReels(); renderHistory(); setStep(1); showLcd(false);
});
  </script>
</body>
</html>
