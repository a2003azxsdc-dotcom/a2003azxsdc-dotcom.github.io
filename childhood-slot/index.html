<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>童年課堂紙條造句 × AI生圖</title>
  <style>
:root {
  --gold: #ffd764;
  --gold-2: #f0b429;
  --led: #fff4c0;
  --cyan: #3ef0ff;
  --text: #fff8ec;
  --muted: #d2c0a8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: #07050a;
  color: var(--text);
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}
body {
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  overflow: hidden;
}
/* Survive a host page (e.g. Gemini share) turning body into a flex centering container */
.app-wrap, .machine { align-self: flex-start; margin-top: 0; }
button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; border: none; background: none; color: inherit; }
.sr-only, .visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);
}
.hidden { display: none !important; }

/* v5: contain-fit by default (v3). On a portrait phone (width <= 600px) that is
   height-limited, fill container width, keep 1536:2752, top-align, and allow
   vertical scrolling instead of shrinking the cabinet. */
.app-wrap {
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  max-width: none;
  margin: 0;
  padding: 0 0 env(safe-area-inset-bottom, 0px);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow: hidden;
  overflow-x: hidden;
  container-type: size;
}
.machine {
  position: relative;
  box-sizing: border-box;
  aspect-ratio: 1536 / 2752;
  width: 100%;
  max-width: 480px;
  height: auto;
  font-size: clamp(10px, 3.15vw, 15px);
  overflow: hidden;
  background: #000;
  box-shadow: 0 8px 28px rgba(0,0,0,0.55);
  flex: 0 0 auto;
  align-self: flex-start;
  margin-top: 0;
}
@supports (width: 1cqh) {
  .machine {
    width: min(100cqw, calc(100cqh * 1536 / 2752), 480px);
    max-width: 100%;
    max-height: 100%;
    font-size: clamp(10px, 3.15cqi, 15px);
  }
}
html.cabinet-scroll,
html.cabinet-scroll body {
  overflow: hidden;
}
html.cabinet-scroll .app-wrap {
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: none;
}
html.cabinet-scroll .machine {
  max-width: none;
  max-height: none;
}
@supports (width: 1cqh) {
  html.cabinet-scroll .machine {
    width: 100%;
    max-width: 100%;
    max-height: none;
    height: auto;
    font-size: clamp(10px, 3.15cqi, 15px);
  }
}
.cabinet-art {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}
.zone { position: absolute; z-index: 2; }
.debug .zone { outline: 1px solid rgba(0,255,255,0.85); }

/* Mute / admin on speakers */
.icon-btn {
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 0.72em;
  font-weight: 900;
  letter-spacing: 0.04em;
  color: #1b1d22;
  background: radial-gradient(circle at 35% 30%, #fff, #c9d0d8 48%, #6a727a);
  box-shadow: 0 2px 0 #2c3034, inset 0 1px 0 #fff, 0 0 8px rgba(255,210,80,0.25);
}
.icon-btn[aria-pressed="true"] { color: #7a1020; }

/* Marquee over Hard Boiled logo */
.zone-marquee {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(180deg, #14060c, #07040a);
  border: 1px solid rgba(255, 215, 100, 0.55);
  box-shadow: inset 0 0 10px rgba(255, 80, 80, 0.25), 0 0 10px rgba(255, 200, 60, 0.35);
  border-radius: 3px;
}
.mq-bulbs { display: flex; justify-content: space-between; height: 14%; padding: 0 2%; flex-shrink: 0; }
.mq-bulbs i {
  width: 5px; height: 5px; border-radius: 50%;
  background: #fff6c0;
  box-shadow: 0 0 5px #ffd764;
  animation: chase-bulb 0.9s linear infinite;
  align-self: center;
}
@keyframes chase-bulb {
  0%, 14% { opacity: 1; filter: brightness(1.8); transform: scale(1.15); }
  24%, 100% { opacity: 0.3; filter: brightness(0.55); transform: scale(0.9); }
}
.marquee-box { flex: 1; overflow: hidden; position: relative; min-height: 0; }
.marquee-track {
  display: flex; width: max-content; height: 100%;
  align-items: center;
  animation: marquee 16s linear infinite;
  white-space: nowrap;
}
.marquee-track span {
  padding: 0 1.6em;
  font-size: 0.92em;
  font-weight: 900;
  color: var(--cyan);
  text-shadow: 0 0 6px #3ef0ff, 0 0 12px rgba(62,240,255,0.8);
  animation: neon-flicker 6s ease-in-out infinite;
}
.marquee-track span:nth-child(even) {
  color: #ffe07a;
  text-shadow: 0 0 6px #ffd764, 0 0 12px rgba(255,215,100,0.8);
  animation-delay: 1.4s;
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes neon-flicker {
  0%, 92%, 100% { opacity: 1; }
  93% { opacity: 0.4; }
  95% { opacity: 1; }
  96% { opacity: 0.25; }
  97.5% { opacity: 1; }
}

/* LCD sentence */
.zone-lcd, .zone-history {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.4s ease, visibility 0.4s;
}
.zone-lcd.is-revealed, .zone-history.is-revealed {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.zone-lcd {
  background: rgba(6, 4, 16, 0.92);
  box-shadow: inset 0 0 14px rgba(0,0,0,0.55), 0 0 10px rgba(255, 180, 40, 0.15);
  color: var(--led);
  display: flex;
  flex-direction: column;
  padding: 3% 3.2% 2.5%;
  overflow: hidden;
  border-radius: 2px;
}
.lcd-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 4px; flex-shrink: 0; margin-bottom: 2%;
}
.lcd-tag {
  font-size: 0.62em; font-weight: 800; letter-spacing: 0.12em;
  color: var(--gold); text-shadow: 0 0 6px rgba(255,200,60,0.5);
}
.btn-copy {
  background: linear-gradient(180deg, #3a3a22, #1a180c);
  color: var(--gold);
  border: 1px solid var(--gold-2);
  padding: 0.15em 0.45em;
  font-size: 0.62em;
  font-weight: 800;
  border-radius: 3px;
  white-space: nowrap;
}
.btn-copy.copied { color: #9dffb0; border-color: #3d8; }
#sentence {
  flex: 1;
  font-size: 0.86em;
  font-weight: 800;
  line-height: 1.35;
  overflow: auto;
  min-height: 0;
  text-shadow: 0 0 6px rgba(255, 227, 140, 0.35);
}
#sentence .hl {
  color: #fffce8;
  background: rgba(255, 70, 70, 0.28);
  padding: 0 0.1em;
  border-radius: 2px;
}
.lcd-preview {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0.28; pointer-events: none;
}
.zone-lcd.has-img #sentence, .zone-lcd.has-img .lcd-top { position: relative; z-index: 1; }
.lcd-loading {
  position: absolute; inset: 0; z-index: 2;
  background: rgba(0,0,0,0.72);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0.4em;
  font-size: 0.72em; font-weight: 800; color: var(--gold);
}
.spinner {
  width: 1.4em; height: 1.4em;
  border: 2px solid rgba(255,211,90,0.25);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Reels */
.reel-window {
  overflow: hidden;
  background: linear-gradient(180deg, #f4f4f8, #cfd0d8);
  box-shadow: inset 0 4px 8px rgba(0,0,0,0.35), inset 0 -4px 8px rgba(0,0,0,0.28);
}
.reel-strip { will-change: transform; }
.reel-window.spinning .reel-strip { filter: blur(3px); }
.reel-item {
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #fbfbfd 0%, #e6e6ee 45%, #c8c9d2 100%);
  box-shadow: inset 0 -1px 0 rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.7);
}
.reel-item svg { width: 82%; height: 82%; display: block; }
.reel-window.landed { box-shadow: inset 0 0 12px rgba(255, 200, 60, 0.28), inset 0 4px 8px rgba(0,0,0,0.3); }

/* Transparent hit targets on real buttons / knob */
.slot-knob, .slot-btn {
  border-radius: 50%;
  background: transparent;
  z-index: 4;
  position: absolute;
}
.slot-btn.next-step::before, .slot-knob.next-step::before {
  content: "";
  position: absolute;
  inset: -22%;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 0 10px 3px rgba(255, 40, 50, 0.85), 0 0 22px 8px rgba(255, 80, 80, 0.45);
  animation: ring-pulse 0.7s ease-in-out infinite;
  pointer-events: none;
}
.slot-knob.next-step::before {
  border-color: #fff6c8;
  box-shadow: 0 0 10px 3px rgba(255, 200, 50, 0.8), 0 0 20px 7px rgba(255, 180, 40, 0.4);
}
.slot-btn.next-step, .slot-knob.next-step {
  animation: btn-bounce 0.7s ease-in-out infinite;
}
@keyframes ring-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.12); opacity: 0.65; }
}
@keyframes btn-bounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6%) scale(1.06); }
}
.slot-btn.is-locked::after, .slot-knob.is-locked::after {
  content: "";
  position: absolute;
  inset: -8%;
  border-radius: 50%;
  background: rgba(0,0,0,0.48);
  pointer-events: none;
}
.slot-knob:disabled, .slot-btn:disabled { cursor: default; }
.slot-btn.is-locked, .slot-knob.is-locked { cursor: not-allowed; }

.speech-bubble {
  position: absolute;
  z-index: 6;
  display: none;
  top: 61%;
  background: #fffdf6;
  color: #1a0a0a;
  font-weight: 900;
  font-size: 0.78em;
  line-height: 1.25;
  padding: 0.4em 0.62em;
  border-radius: 0.85em;
  border: 2px solid #1a1a1a;
  box-shadow: 0 3px 0 #000, 0 6px 14px rgba(0,0,0,0.4);
  white-space: nowrap;
  pointer-events: none;
  text-align: center;
  transform: translateX(-50%);
}
/* Centered above the same three red buttons in both versions */
.speech-bubble[data-bubble-step="1"] { left: 36.95%; }
.speech-bubble[data-bubble-step="2"] { left: 50.46%; }
.speech-bubble[data-bubble-step="3"] { left: 63.96%; }
/* Visible ~3s, hidden ~2s, then repeat */
.speech-bubble.is-on { display: block; animation: bubble-cycle 5s ease-in-out infinite; }
.speech-bubble::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -8px;
  margin-left: -8px;
  border: 8px solid transparent;
  border-top-color: #fffdf6;
  filter: drop-shadow(0 2px 0 #000);
}
@keyframes bubble-cycle {
  0% { opacity: 0; transform: translateX(-50%) scale(0.7); }
  6% { opacity: 1; transform: translateX(-50%) scale(1); }
  14% { transform: translateX(-50%) translateY(-3px); }
  22% { transform: translateX(-50%) translateY(0); }
  30% { transform: translateX(-50%) translateY(-3px); }
  38% { transform: translateX(-50%) translateY(0); }
  46% { transform: translateX(-50%) translateY(-3px); }
  54% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  60% { opacity: 1; transform: translateX(-50%) scale(1); }
  68% { opacity: 0; transform: translateX(-50%) scale(0.85); }
  100% { opacity: 0; transform: translateX(-50%) scale(0.85); }
}
.skip-upload {
  position: absolute;
  z-index: 6;
  font-size: 0.58em;
  font-weight: 800;
  color: #ffe08a;
  text-decoration: underline;
  text-shadow: 0 1px 2px #000;
  background: rgba(0,0,0,0.45);
  padding: 0.2em 0.45em;
  border-radius: 4px;
}
.skip-upload.hidden { display: none !important; }

.upload-preview {
  position: absolute;
  z-index: 5;
  display: none;
  align-items: center;
  gap: 4px;
  background: rgba(0,0,0,0.72);
  border: 1px solid var(--gold);
  border-radius: 4px;
  padding: 3px 5px;
  font-size: 0.58em;
}
.upload-preview.show { display: flex; }
.upload-preview img { width: 1.6em; height: 1.6em; object-fit: cover; border: 1px solid var(--gold); }
.upload-preview .meta b { color: #9dffb0; display: block; }
.upload-preview .meta span { color: var(--muted); max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.linkish { background: none; color: #ff8a8a; font-size: 1em; font-weight: 700; padding: 2px; }

/* History over lower art panel */
.zone-history {
  background: rgba(6, 4, 12, 0.82);
  box-shadow: inset 0 0 16px rgba(0,0,0,0.5);
  padding: 2.2% 2.4%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.history-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.68em; font-weight: 800; color: var(--gold);
  letter-spacing: 0.12em; margin-bottom: 2%; flex-shrink: 0;
}
.history-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 3px;
  overflow: auto;
  min-height: 0;
  align-content: start;
}
.history-grid .empty-h, .hint {
  grid-column: 1 / -1;
  text-align: center;
  color: #e8dcc8;
  font-size: 0.78em;
  font-weight: 700;
  line-height: 1.45;
  padding: 0.4em 0.6em;
}
.thumb {
  aspect-ratio: 9/16;
  border: 1px solid #8a9098;
  overflow: hidden;
  background: #111;
  cursor: pointer;
  padding: 0;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:focus, .thumb:hover { outline: 2px solid var(--gold); }

/* Toast / lightbox / admin — same roles as before */
#toast {
  position: fixed; left: 50%; bottom: 20px;
  transform: translateX(-50%) translateY(16px);
  background: #1a1210; color: #fff;
  border: 1px solid var(--gold);
  padding: 10px 14px; font-size: 13px; font-weight: 700;
  z-index: 80; max-width: 90vw; opacity: 0; pointer-events: none;
  transition: 0.25s; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.92); z-index: 90;
  padding: 16px; flex-direction: column;
  align-items: center; justify-content: center;
}
#lightbox.show { display: flex; }
#lightbox img { max-width: 100%; max-height: 78dvh; object-fit: contain; }
#lightbox .cap { color: var(--led); font-size: 13px; font-weight: 700; margin-top: 10px; text-align: center; max-width: 36em; }
#lightbox .x {
  position: absolute; top: 10px; right: 10px;
  width: 40px; height: 40px; border-radius: 50%;
  background: #fff; color: #000; font-size: 20px; font-weight: 900;
}

#admin {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.76); z-index: 70;
  overflow: auto; padding: 12px 8px 24px;
}
#admin.show { display: block; }
.admin-card {
  max-width: 480px; margin: 0 auto;
  background: linear-gradient(180deg, #241018, #161016);
  border: 2px solid #b8860b; border-radius: 10px; padding: 12px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.5);
}
.admin-card h2 { font-size: 16px; color: var(--gold); margin-bottom: 8px; }
.admin-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
.admin-row select, .admin-row input, .admin-card textarea, .field input, .field textarea {
  background: #0c0a0e; color: var(--text); border: 1px solid #5a5050;
  padding: 7px 8px; font-size: 13px; border-radius: 4px;
}
.admin-row select { flex: 1; min-width: 140px; }
.mini {
  background: #2a2428; color: #fff; border: 1px solid #6a6060;
  padding: 6px 8px; font-size: 12px; font-weight: 800; border-radius: 4px;
}
.mini.gold { background: #5a4010; border-color: var(--gold); color: var(--gold); }
.mini.danger { background: #4a1010; border-color: #f66; color: #f88; }
.tabs { display: flex; gap: 4px; margin: 8px 0; }
.tabs button {
  flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800;
  background: #2a2024; color: var(--muted); border-bottom: 2px solid transparent;
}
.tabs button.on { color: var(--gold); border-bottom-color: var(--gold); background: #3a2820; }
.entry-list { max-height: 280px; overflow: auto; display: grid; gap: 6px; }
.entry { background: #0e0c10; border: 1px solid #3a3438; padding: 8px; font-size: 12px; border-radius: 4px; }
.entry b { display: block; font-size: 13px; margin-bottom: 2px; }
.entry .en { color: var(--muted); line-height: 1.4; word-break: break-word; }
.entry .row { display: flex; gap: 6px; margin-top: 6px; }
.field { display: grid; gap: 4px; margin-top: 8px; }
.field label { font-size: 11px; color: var(--muted); font-weight: 700; }


/* v2: translucent marquee over the top arcade scene */
.zone-marquee {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(180deg, rgba(4,2,10,0.55) 0%, rgba(4,2,10,0.28) 70%, rgba(4,2,10,0.08) 100%);
  border: none;
  box-shadow: none;
  border-radius: 0;
}
.mq-bulbs { display: flex; justify-content: space-between; height: 12%; padding: 0 3%; flex-shrink: 0; }
.mq-bulbs i {
  width: 5px; height: 5px; border-radius: 50%;
  background: #fff6c0;
  box-shadow: 0 0 5px #ffd764;
  animation: chase-bulb 0.9s linear infinite;
  align-self: center;
}

/* v2: glass LCD so the lightbox art still peeks through */
.zone-lcd {
  background: rgba(6, 4, 16, 0.82);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  box-shadow: inset 0 0 14px rgba(0,0,0,0.55), 0 0 10px rgba(255, 180, 40, 0.2);
  border: 1px solid rgba(255, 215, 100, 0.38);
  color: var(--led);
  display: flex;
  flex-direction: column;
  padding: 2.4% 3.2% 2.2%;
  overflow: hidden;
  border-radius: 5px;
}

/* v2: 3D cylindrical reel windows */
.reel-window {
  overflow: hidden;
  background: linear-gradient(180deg, #f8f8fc, #d0d1d8 55%, #b9bac4);
  box-shadow: inset 0 6px 10px rgba(0,0,0,0.38), inset 0 -5px 8px rgba(0,0,0,0.3);
  border-radius: 3px;
}
.reel-window::before {
  content: "";
  position: absolute inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg,
    rgba(0,0,0,0.38) 0%,
    rgba(0,0,0,0.10) 12%,
    rgba(255,255,255,0.22) 28%,
    transparent 42%,
    transparent 58%,
    rgba(255,255,255,0.12) 74%,
    rgba(0,0,0,0.12) 88%,
    rgba(0,0,0,0.38) 100%);
}
.reel-window::after {
  content: "";
  position: absolute; left: 0; right: 0; top: 0; height: 30%;
  z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,0.38), transparent);
}
.reel-strip { will-change: transform; position: relative; z-index: 1; }
.reel-window.spinning .reel-strip { filter: blur(4px) contrast(1.05) saturate(1.08); }
.reel-item {
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #fcfcff 0%, #e8e8f0 42%, #c5c6d0 100%);
  box-shadow: inset 0 -1px 0 rgba(0,0,0,0.14), inset 0 1px 0 rgba(255,255,255,0.75);
}
.reel-item svg {
  width: 86%; height: 86%; display: block;
  filter: drop-shadow(0 3px 2px rgba(0,0,0,0.45)) drop-shadow(0 0 3px rgba(255,220,80,0.25));
}
.reel-window.landed {
  box-shadow: inset 0 0 16px rgba(255, 210, 70, 0.45), inset 0 4px 8px rgba(0,0,0,0.3);
}

.icon-btn {
  z-index: 12;
  font-size: 1.05em;
  line-height: 1;
  text-shadow: 0 1px 0 #fff;
}
.icon-btn[aria-pressed="true"] { color: #7a1020; filter: grayscale(0.4); }

.fx-layer {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 18;
}
.jackpot-banner {
  position: absolute;
  left: 10%; top: 40.4%;
  width: 80%;
  z-index: 19;
  pointer-events: none;
  text-align: center;
  font-weight: 900;
  font-size: 1.15em;
  letter-spacing: 0.12em;
  color: #fff8d0;
  text-shadow: 0 0 8px #ffd24a, 0 0 18px #ff4a2a, 0 2px 0 #7a2000;
  opacity: 0;

  <script>
  /* v5: phone + height-limited → fill width and scroll vertically; otherwise v3 contain-fit */
  (function () {
    var AR = 1536 / 2752;
    var MAX_W = 480;
    var PHONE_W = 600;
    var lastW = 0, lastH = 0, lastScroll = null;
    function avail() {
      var wrap = document.querySelector(".app-wrap");
      var vv = window.visualViewport;
      var iw = document.documentElement.clientWidth || window.innerWidth || 0;
      var ih = document.documentElement.clientHeight || window.innerHeight || 0;
      if (vv) {
        if (vv.width) iw = Math.min(iw || vv.width, vv.width);
        if (vv.height) ih = Math.min(ih || vv.height, vv.height);
      }
      var w = wrap ? wrap.clientWidth : 0;
      var h = wrap ? wrap.clientHeight : 0;
      if (!w || w < 2) w = iw;
      if (!h || h < 2) h = ih;
      /* Never treat the wrap's content height as the viewport (avoids mode flip when scrolling). */
      if (ih && h > ih + 1) h = ih;
      if (iw && w > iw + 1) w = iw;
      return { w: w || 390, h: h || 640 };
    }
    function fitCabinetToViewport() {
      var m = document.getElementById("machine");
      if (!m) return;
      var a = avail();
      var phone = a.w <= PHONE_W;
      var fillH = a.w / AR;
      var scroll = !!(phone && fillH > a.h + 0.5);
      var root = document.documentElement;
      if (scroll) root.classList.add("cabinet-scroll");
      else root.classList.remove("cabinet-scroll");
      var w, h;
      if (scroll) {
        a = avail();
        w = a.w;
        h = w / AR;
      } else {
        w = Math.min(a.w, MAX_W);
        h = w / AR;
        if (h > a.h) {
          h = a.h;
          w = h * AR;
        }
        if (w > a.w) {
          w = a.w;
          h = w / AR;
        }
      }
      w = Math.max(1, Math.floor(w));
      h = Math.max(1, Math.round(w / AR));
      if (!scroll && h > a.h) {
        h = Math.max(1, Math.floor(a.h));
        w = Math.max(1, Math.round(h * AR));
      }
      if (w === lastW && h === lastH && lastScroll === scroll) return;
      lastW = w;
      lastH = h;
      lastScroll = scroll;
      m.style.width = w + "px";
      m.style.height = h + "px";
      m.style.maxWidth = "none";

      var fs = Math.max(10, Math.min(15, w * 0.0315));
      m.style.fontSize = fs + "px";
    }
    window.fitCabinetToViewport = fitCabinetToViewport;
    function bind() {
      fitCabinetToViewport();
      window.addEventListener("resize", fitCabinetToViewport);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fitCabinetToViewport);
        window.visualViewport.addEventListener("scroll", fitCabinetToViewport);
      }
      if (window.ResizeObserver) {

      }
      document.addEventListener("visibilitychange", function () {

      });
    }

      document.addEventListener("DOMContentLoaded", bind);

    this.coins();
  },
  startBGM() {
    if (!this.ctx || this.muted || this.bgTimer) return;
    const tempo = 0.2;
    const melody = [
      [0, 392], [1, 493.88], [2, 587.33], [3, 493.88],
      [4, 392], [5, 440], [6, 523.25], [7, 440],
      [8, 392], [9, 493.88], [10, 587.33], [11, 659.25],
      [12, 587.33], [13, 523.25], [14, 493.88], [15, 440]
    ];
    const bass = [98, 98, 130.81, 130.81, 87.31, 87.31, 110, 110, 98, 98, 130.81, 130.81, 87.31, 87.31, 110, 123.47];
    const sched = () => {
      if (!this.ctx || this.muted) return;
      const t0 = this.ctx.currentTime + 0.02;
      melody.forEach(([i, f]) => {
        this.osc("square", f, 0.16, 0.07, this.bgGain, t0 + i * tempo);
        this.osc("triangle", f * 2, 0.12, 0.03, this.bgGain, t0 + i * tempo);
      });
      bass.forEach((f, i) => {
        this.osc("triangle", f, 0.22, 0.11, this.bgGain, t0 + i * tempo);
      });
      for (let i = 0; i < 16; i += 2) {
        this.noise(0.04, 0.05, this.bgGain, t0 + i * tempo, 4000, "highpass", 0.6);
      }
    };
    sched();
    this.bgTimer = setInterval(sched, 16 * tempo * 1000);
  },
  stopBGM() {
    if (this.bgTimer) { clearInterval(this.bgTimer); this.bgTimer = null; }
  }
};

const JackpotFX = {
  canvas: null,
  ctx: null,
  parts: [],
  raf: 0,
  until: 0,
  cap: 140,
  ensure() {
    const c = $("fx-layer");
    const m = $("machine");
    if (!c || !m) return null;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = m.clientWidth;
    const h = m.clientHeight;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      c.style.width = w + "px";
      c.style.height = h + "px";
    }
    this.canvas = c;
    this.ctx = c.getContext("2d");
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return this.ctx;
  },
  burst() {
    const m = $("machine");
    if (!m) return;
    const w = m.clientWidth, h = m.clientHeight;
    const colors = ["#ffd24a","#ff4a4a","#ffeaa0","#3ef0ff","#ff7ad9","#7cff6a","#fff","#ff9a2a"];
    const origins = [
      { x: w * 0.268, y: h * 0.502 },
      { x: w * 0.502, y: h * 0.502 },
      { x: w * 0.736, y: h * 0.502 }
    ];
    const need = this.cap - this.parts.length;
    for (let i = 0; i < need; i++) {
      const o = origins[i % 3];
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.15;
      const sp = 180 + Math.random() * 280;
      this.parts.push({
        x: o.x, y: o.y,
        vx: Math.cos(ang) * sp * (0.4 + Math.random()),
        vy: Math.sin(ang) * sp,
        w: 4 + Math.random() * 6,
        h: 7 + Math.random() * 10,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 8,
        color: colors[i % colors.length],
        life: 1,
        g: 360 + Math.random() * 160
      });
    }
  },
  start() {
    const machine = $("machine");
    if (machine) machine.classList.add("is-jackpot");
    const banner = $("jackpot-banner");
    if (banner) {
      banner.classList.remove("show");
      void banner.offsetWidth;
      banner.classList.add("show");
    }
    this.parts = [];
    this.ensure();
    this.burst();
    this.until = performance.now() + 4200;
    if (this.raf) cancelAnimationFrame(this.raf);
    let last = performance.now();
    const loop = (now) => {
      const ctx = this.ensure();
      if (!ctx) return;
      const w = this.canvas.clientWidth || $("machine").clientWidth;
      const h = this.canvas.clientHeight || $("machine").clientHeight;
      const dt = Math.min(0.04, (now - last) / 1000);
      last = now;
      ctx.clearRect(0, 0, w, h);
      if (now < this.until) {
        const pulse = 0.35 + 0.35 * Math.abs(Math.sin(now / 90));
        ctx.fillStyle = "rgba(255, 210, 60, " + (pulse * 0.12) + ")";
        ctx.fillRect(0, 0, w, h);
      }
      const next = [];
      for (const p of this.parts) {
        p.vy += p.g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        p.life -= dt * 0.13;
        if (p.y > h + 20 || p.life <= 0) continue;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
        next.push(p);
      }
      this.parts = next;
      if (this.parts.length || now < this.until) {
        this.raf = requestAnimationFrame(loop);
      } else {
        this.stop(false);
      }
    };
    this.raf = requestAnimationFrame(loop);
    clearTimeout(this._tid);
    this._tid = setTimeout(() => this.stop(true), 4500);
  },
  stop(clearClass) {
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; }
    if (this.ctx && this.canvas) {
      const w = this.canvas.clientWidth || 0;
      const h = this.canvas.clientHeight || 0;
      this.ctx.clearRect(0, 0, w, h);
    }
    this.parts = [];
    if (clearClass !== false) {
      const machine = $("machine");
      if (machine) machine.classList.remove("is-jackpot");
    }
  }
};

/* ---------- reels (classic symbols, not sentence text) ---------- */
const SYMBOLS = ["seven","bar","bar2","bar3","cherry","bell","lemon","grape","melon","star","diamond","orange"];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function measureItemH() {
  const vp = $("viewport-outfit");
  if (!vp) return 96;
  const h = Math.round(vp.getBoundingClientRect().height);
  return Math.max(24, h);
}

function initReels() {
  ITEM_H = measureItemH();
  ["outfit", "location", "action"].forEach((key) => {
    const el = $("strip-" + key);
    const items = shuffle(SYMBOLS);
    reels[key] = { el, offset: 0, speed: 0, spinning: false, raf: 0, items: items, total: 0, cycle: 0 };
    buildStrip(key);
    const land = (state.currentSymbols && state.currentSymbols[key]) || items[0];
    snapReelTo(key, land);
  });
}
function snapReelTo(key, symbolId) {
  const r = reels[key];
  if (!r || !r.items || !r.items.length) return;
  let targetIndex = r.items.indexOf(symbolId);
  if (targetIndex < 0) targetIndex = 0;
  const dest = targetIndex * ITEM_H + ITEM_H * r.cycle * 2;
  r.offset = dest;
  r.el.style.transform = "translateY(" + (-dest) + "px)";
  r.el.parentElement.classList.add("landed");
  r.el.parentElement.classList.remove("spinning");
}
function buildStrip(key) {
  const r = reels[key];
  const items = r.items;
  r.el.innerHTML = "";
  const copies = Math.max(14, Math.ceil(48 / Math.max(1, items.length)));
  const list = items.length ? items : ["star"];
  for (let c = 0; c < copies; c++) {
    list.forEach(id => {
      const d = document.createElement("div");
      d.className = "reel-item";
      d.style.height = ITEM_H + "px";
      d.dataset.symbol = id;
      d.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#sym-' + id + '"></use></svg>';
      r.el.appendChild(d);
    });
  }
  r.total = list.length * copies;
  r.cycle = list.length;
  r.offset = 0;
  r.el.style.transform = "translateY(0px)";
  r.el.parentElement.classList.remove("spinning", "landed");
}
function startReelSpin(key) {
  const r = reels[key];
  r.spinning = true;
  r.speed = 2600 + Math.random() * 500;
  r.el.parentElement.classList.add("spinning");
  r.el.parentElement.classList.remove("landed");
  let last = performance.now();
  const loop = (now) => {
    if (!r.spinning) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const loopLen = ITEM_H * r.total;
    r.offset = (r.offset + r.speed * dt) % loopLen;
    r.el.style.transform = "translateY(" + (-r.offset) + "px)";
    r.raf = requestAnimationFrame(loop);
  };
  r.raf = requestAnimationFrame(loop);
}
function stopReel(key, symbolId) {
  return new Promise(resolve => {
    const r = reels[key];
    r.spinning = false;
    if (r.raf) cancelAnimationFrame(r.raf);
    r.el.parentElement.classList.remove("spinning");
    const n = Math.max(1, r.cycle);
    let targetIndex = r.items.indexOf(symbolId);
    if (targetIndex < 0) targetIndex = 0;
    const loopOne = ITEM_H * n;
    const current = r.offset;
    let dest = targetIndex * ITEM_H;
    while (dest < current + loopOne * 0.45) dest += loopOne;
    const maxOff = ITEM_H * r.total - ITEM_H;
    if (dest > maxOff) dest = targetIndex * ITEM_H + loopOne * Math.max(0, Math.floor((r.total / n) - 3));
    const start = current;
    const dist = dest - start;
    const dur = 560;
    const t0 = performance.now();
    const easeOutBack = (t) => {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };
    const anim = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      r.offset = start + dist * easeOutBack(t);
      r.el.style.transform = "translateY(" + (-r.offset) + "px)";
      if (t < 1) {
        requestAnimationFrame(anim);
      } else {
        r.offset = dest;
        r.el.style.transform = "translateY(" + (-dest) + "px)";
        r.el.parentElement.classList.add("landed");
        resolve();
      }
    };
    requestAnimationFrame(anim);
  });
}

/* ---------- Canvas image generation ---------- */
async function generateAIImage() {
  if (!IS_CANVAS) return;
  if (state.isGenerating || state.isSpinning) return;
  if (!state.currentPrompt) return;
  state.isGenerating = true;
  setPreview("loading");
  setStep(3);

  const promptText = state.currentPrompt;
  const apiKey = "";
  const apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=" + apiKey;

  try {
    let payload = null;
    if (state.uploadedImageBase64) {
      const base64Data = state.uploadedImageBase64.split(",")[1];
      const mimeType = state.uploadedImageBase64.split(";")[0].split(":")[1] || "image/png";
      payload = {
        contents: [{
          role: "user",
          parts: [
            { text: "Strictly reference the facial features, eyes, and likeness of the person in this uploaded image, maintaining exact character identity and realism: " + promptText },
            { inlineData: { mimeType: mimeType, data: base64Data } }
          ]
        }],
        generationConfig: {
          responseModalities: ["TEXT", "IMAGE"],
          imageConfig: { aspectRatio: "9:16" }
        }
      };
    } else {
      payload = {
        contents: [{ role: "user", parts: [{ text: promptText }] }],
        generationConfig: {
          responseModalities: ["IMAGE"],
          imageConfig: { aspectRatio: "9:16" }
        }
      };
    }

    const response = await fetchWithRetry(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const result = await response.json();

    let imageBase64Output = null;
    const candidates = result.candidates;
    if (candidates && candidates.length > 0) {
      const parts = candidates[0].content && candidates[0].content.parts || [];
      const imgPart = parts.find(p => p.inlineData && p.inlineData.data);
      if (imgPart) {
        const mime = imgPart.inlineData.mimeType || "image/png";
        imageBase64Output = "data:" + mime + ";base64," + imgPart.inlineData.data;
      }
    }
    if (!imageBase64Output) {
      throw new Error((result.error && result.error.message) || "未收到有效的影像數據回傳");
    }
    renderGeneratedResult(imageBase64Output);
    showToast("🎉 AI 生圖成功！已同頁面展示！");
  } catch (error) {
    console.error("Image generation error:", error);
    handleGenerationFallback(promptText);
  } finally {
    state.isGenerating = false;
    setStep(2);
  }
}

function fetchWithRetry(url, options, retries, delayMs) {
  if (retries == null) retries = 2;
  if (delayMs == null) delayMs = 1500;
  return (async function attempt() {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 12000);
      const response = await fetch(url, Object.assign({}, options, { signal: ctrl.signal }));
      clearTimeout(t);
      if (!response.ok && retries > 0) {
        await delay(delayMs);
        return fetchWithRetry(url, options, retries - 1, delayMs * 2);
      }
      return response;
    } catch (err) {
      if (retries > 0) {
        await delay(delayMs);
        return fetchWithRetry(url, options, retries - 1, delayMs * 2);
      }
      throw err;
    }
  })();
}

function handleGenerationFallback(promptText) {
  const url = makeFallbackImage();
  renderGeneratedResult(url);
  showToast("生圖失敗，目前顯示的是示意圖，請在 Gemini Canvas 中執行");
}

function makeFallbackImage() {
  const c = document.createElement("canvas");
  c.width = 720; c.height = 1280;
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, 1280);
  grd.addColorStop(0, "#1a102f");
  grd.addColorStop(1, "#0a0510");
  g.fillStyle = grd;
  g.fillRect(0, 0, 720, 1280);
  g.strokeStyle = "#ffd764";
  g.lineWidth = 8;
  g.strokeRect(36, 36, 648, 1208);
  g.fillStyle = "#ffd764";
  g.font = "bold 48px sans-serif";
  g.textAlign = "center";
  g.fillText("示意圖", 360, 380);
  g.font = "22px sans-serif";
  g.fillStyle = "#c9a227";
  g.fillText("請在 Gemini Canvas 中執行以生成實圖", 360, 430);
  g.font = "28px sans-serif";
  g.fillStyle = "#ffe08a";
  const lines = [];
  if (state.current.outfit) lines.push(state.current.outfit.name);
  if (state.current.location) lines.push(state.current.location.name);
  if (state.current.action) lines.push(state.current.action.name);
  let y = 520;
  lines.forEach(text => {
    wrapText(g, text, 360, y, 620, 36);
    y += 90;
  });
  return c.toDataURL("image/jpeg", 0.82);
}
function wrapText(g, text, x, y, maxW, lh) {
  const chars = String(text).split("");
  let line = "";
  let yy = y;
  chars.forEach(ch => {
    const test = line + ch;
    if (g.measureText(test).width > maxW) {
      g.fillText(line, x, yy);
      line = ch;
      yy += lh;
    } else line = test;
  });
  if (line) g.fillText(line, x, yy);
}

function renderGeneratedResult(imageUrl) {
  setPreview("image", imageUrl);
  addToHistory(imageUrl, state.currentSentence);
}

function setPreview(mode, url) {
  if (!IS_CANVAS) return;
  const loading = $("preview-loading");
  const img = $("preview-image");
  const lcd = document.querySelector(".zone-lcd");
  if (loading) loading.classList.add("hidden");
  if (img) img.classList.add("hidden");
  if (lcd) lcd.classList.remove("has-img");
  if (mode === "loading") {
    if (loading) loading.classList.remove("hidden");
  } else if (mode === "image" && img && url) {
    img.src = url;
    img.classList.remove("hidden");
    if (lcd) lcd.classList.add("has-img");
  }
}

function addToHistory(imgUrl, title) {
  state.history.unshift({ url: imgUrl, title: title || "", time: new Date().toLocaleTimeString() });
  state.history = state.history.slice(0, 20);
  saveHistory();
  renderHistory();
}

function renderHistory() {
  if (!IS_CANVAS) return;
  syncHistoryWall();
  const box = $("history-grid");
  const count = $("history-count");
  if (!box) return;
  box.innerHTML = "";
  if (!state.history.length) {
    const d = document.createElement("div");
    d.className = "empty-h";
    d.textContent = "拉桿後會自動生圖，縮圖會出現在這裡，點擊可看原圖";
    box.appendChild(d);
  } else {
    state.history.forEach((item, index) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "thumb";
      b.setAttribute("data-h", String(index));
      const im = document.createElement("img");
      im.alt = item.title || "歷史圖片";
      im.src = item.url;
      b.appendChild(im);
      b.addEventListener("click", () => openLightbox(item.url, item.title));
      box.appendChild(b);
    });
  }
  count.textContent = state.history.length + " 張";
}

function openLightbox(url, title) {
  $("lightbox-img").src = url;
  $("lightbox-cap").textContent = title || "";
  $("lightbox").classList.add("show");
}
function closeLightbox() {
  $("lightbox").classList.remove("show");
  $("lightbox-img").src = "";
}

/* ---------- upload ---------- */
function handleImageUpload(e) {
  const file = (e.target.files && e.target.files[0]) || (e.dataTransfer && e.dataTransfer.files[0]);
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    showToast("請上傳正確的圖片格式！");
    return;
  }
  const reader = new FileReader();
  reader.onload = function(event) {
    state.uploadedImageBase64 = event.target.result;
    state.uploadedFileName = file.name;
    $("user-image-preview").src = state.uploadedImageBase64;
    $("upload-filename").textContent = file.name;
    $("upload-preview").classList.add("show");
    if (state.current.outfit) buildOutputs();
    showToast("照片載入成功！已鎖定五官特徵");
    if (!state.isSpinning && !state.isGenerating) setStep(2);
  };
  reader.readAsDataURL(file);
}
function removeUploadedImage() {
  state.uploadedImageBase64 = null;
  state.uploadedFileName = "";
  $("file-input").value = "";
  $("upload-preview").classList.remove("show");
  if (state.current.outfit) buildOutputs();
  showToast("已移除上傳照片");
  if (!state.skippedUpload) setStep(1);
}

/* ---------- admin ---------- */
function urlWantsAdmin() {
  try {
    if (new URLSearchParams(location.search).has("admin")) return true;
  } catch (e) {}
  const h = (location.hash || "").replace(/^#/, "").toLowerCase();
  return h === "admin";
}
function maybeOpenAdminFromUrl() {
  if (urlWantsAdmin()) openAdmin();
}
function openAdmin() {
  const el = $("admin");
  if (el) el.classList.add("show");
  renderAdmin();
}
function closeAdmin() {
  const el = $("admin");
  if (el) el.classList.remove("show");
  if ((location.hash || "").replace(/^#/, "").toLowerCase() === "admin") {
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }
  initReels();
}
function renderAdmin() {
  const sel = $("project-select");
  sel.innerHTML = "";
  state.store.projects.forEach(p => {
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = p.name;
    if (p.id === state.activeId) o.selected = true;
    sel.appendChild(o);
  });
  renderEntryList();
}
function renderEntryList() {
  const p = activeProject();
  const key = state.adminTab;
  const list = p[key] || [];
  const box = $("entry-list");
  box.innerHTML = "";
  if (!list.length) {
    const d = document.createElement("div");
    d.className = "empty-h";
    d.textContent = "尚無詞條，請在下方新增";
    box.appendChild(d);
  }
  list.forEach((it, i) => {
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = "<b></b><div class=\"en\"></div><div class=\"row\"></div>";
    div.querySelector("b").textContent = it.name;
    div.querySelector(".en").textContent = it.prompt;
    const row = div.querySelector(".row");
    const eBtn = document.createElement("button");
    eBtn.type = "button"; eBtn.className = "mini"; eBtn.textContent = "修改";
    eBtn.addEventListener("click", () => startEdit(i));
    const dBtn = document.createElement("button");
    dBtn.type = "button"; dBtn.className = "mini danger"; dBtn.textContent = "刪除";
    dBtn.addEventListener("click", () => deleteEntry(i));
    row.appendChild(eBtn); row.appendChild(dBtn);
    box.appendChild(div);
  });
  $("entry-form-title").textContent = state.editingIndex >= 0 ? "修改詞條" : "新增詞條";
  $("btn-save-entry").textContent = state.editingIndex >= 0 ? "儲存修改" : "新增";
  document.querySelectorAll(".tabs button").forEach(b => {
    b.classList.toggle("on", b.getAttribute("data-tab") === state.adminTab);
  });
}
function startEdit(i) {
  const it = activeProject()[state.adminTab][i];
  state.editingIndex = i;
  $("entry-name").value = it.name;
  $("entry-prompt").value = it.prompt;
  $("entry-form-title").textContent = "修改詞條";
  $("btn-save-entry").textContent = "儲存修改";
  $("entry-name").focus();
}
function cancelEdit() {
  state.editingIndex = -1;
  $("entry-name").value = "";
  $("entry-prompt").value = "";
  $("entry-form-title").textContent = "新增詞條";
  $("btn-save-entry").textContent = "新增";
}
function saveEntry() {
  const name = $("entry-name").value.trim();
  const prompt = $("entry-prompt").value.trim();
  if (!name || !prompt) {
    showToast("請填寫中文名稱與英文提示詞");
    return;
  }
  const p = activeProject();
  const arr = p[state.adminTab];
  if (state.editingIndex >= 0) {
    arr[state.editingIndex] = { name, prompt };
  } else {
    arr.push({ name, prompt });
  }
  saveProjects();
  cancelEdit();
  renderEntryList();
  showToast("詞條已儲存");
}
function deleteEntry(i) {
  const p = activeProject();
  if (p[state.adminTab].length <= 1) {
    showToast("每個欄位至少保留一條詞");
    return;
  }
  if (!confirm("確定刪除這條詞？")) return;
  p[state.adminTab].splice(i, 1);
  if (state.editingIndex === i) cancelEdit();
  saveProjects();
  renderEntryList();
}
function switchProject(id) {
  if (!state.store.projects.some(p => p.id === id)) return;
  state.activeId = id;
  saveProjects();
  cancelEdit();
  renderAdmin();
  initReels();
  showToast("已切換至「" + activeProject().name + "」");
}
function createProject() {
  const name = prompt("新專案名稱", "新專案 " + (state.store.projects.length + 1));
  if (name == null) return;
  const n = name.trim() || ("新專案 " + (state.store.projects.length + 1));
  const src = activeProject();
  const p = {
    id: uid(),
    name: n,
    outfits: clone(src.outfits),
    locations: clone(src.locations),
    actions: clone(src.actions)
  };
  state.store.projects.push(p);
  state.activeId = p.id;
  saveProjects();
  renderAdmin();
  initReels();
  showToast("已建立專案「" + n + "」");
}
function renameProject() {
  const p = activeProject();
  const name = prompt("重新命名專案", p.name);
  if (name == null) return;
  const n = name.trim();
  if (!n) return;
  p.name = n;
  saveProjects();
  renderAdmin();
  showToast("已重新命名");
}
function deleteProject() {
  if (state.store.projects.length <= 1) {
    showToast("至少需保留一個專案");
    return;
  }
  const p = activeProject();
  if (!confirm("確定刪除專案「" + p.name + "」？")) return;
  state.store.projects = state.store.projects.filter(x => x.id !== p.id);
  state.activeId = state.store.projects[0].id;
  saveProjects();
  renderAdmin();
  initReels();
  showToast("專案已刪除");
}
function resetDefaultBanks() {
  if (!confirm("將目前專案的詞庫還原成原本的經典詞條，確定？")) return;
  const p = activeProject();
  p.outfits = clone(DEFAULT_BANKS.outfits);
  p.locations = clone(DEFAULT_BANKS.locations);
  p.actions = clone(DEFAULT_BANKS.actions);
  saveProjects();
  cancelEdit();
  renderAdmin();
  initReels();
  showToast("已還原預設詞庫");
}
function exportProject() {
  const p = activeProject();
  const data = {
    name: p.name,
    outfits: p.outfits,
    locations: p.locations,
    actions: p.actions,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (p.name || "project") + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast("已匯出 JSON");
}
function importProjectFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      let list = [];
      if (data && Array.isArray(data.projects)) list = data.projects;
      else if (data && Array.isArray(data.outfits) && Array.isArray(data.locations) && Array.isArray(data.actions)) list = [data];
      else throw new Error("格式不正確");
      list.forEach((src, idx) => {
        if (!Array.isArray(src.outfits) || !Array.isArray(src.locations) || !Array.isArray(src.actions)) return;
        const p = {
          id: uid(),
          name: (src.name && String(src.name).trim()) || ("匯入專案 " + (idx + 1)),
          outfits: src.outfits.map(normalizeEntry).filter(Boolean),
          locations: src.locations.map(normalizeEntry).filter(Boolean),
          actions: src.actions.map(normalizeEntry).filter(Boolean)
        };
        if (!p.outfits.length || !p.locations.length || !p.actions.length) {
          showToast("匯入檔案有欄位是空的，已略過該專案");
          return;
        }
        state.store.projects.push(p);
        state.activeId = p.id;
      });
      saveProjects();
      renderAdmin();
      initReels();
      showToast("匯入完成，目前專案：「" + activeProject().name + "」");
    } catch (err) {
      showToast("無法匯入：JSON 格式不正確");
    }
    $("import-file").value = "";
  };
  reader.readAsText(file);
}
function normalizeEntry(it) {
  if (!it || !it.name || !it.prompt) return null;
  return { name: String(it.name), prompt: String(it.prompt) };
}

/* ---------- toast ---------- */
let toastTimer = null;
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- init ---------- */
function bindUI() {
  const adminClose = $("btn-admin-close");
  if (adminClose) adminClose.addEventListener("click", closeAdmin);
  window.addEventListener("hashchange", maybeOpenAdminFromUrl);
  const marquee = document.querySelector(".zone-marquee");
  if (marquee) {
    let pressTimer = null;
    const startPress = (e) => {
      if (pressTimer) clearTimeout(pressTimer);
      pressTimer = setTimeout(() => { pressTimer = null; openAdmin(); }, 3000);
    };
    const cancelPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
    marquee.addEventListener("pointerdown", startPress);
    ["pointerup","pointercancel","pointerleave"].forEach(ev => marquee.addEventListener(ev, cancelPress));
    marquee.addEventListener("contextmenu", (e) => e.preventDefault());
  }
  $("btn-copy").addEventListener("click", () => {
    AudioEng.unlock();
    copyCurrentPrompt();
  });
  const copyStep = $("btn-copy-step");
  if (copyStep) copyStep.addEventListener("click", () => { AudioEng.unlock(); copyCurrentPrompt(); });
  const skip = $("btn-skip-upload");
  if (skip) skip.addEventListener("click", () => {
    AudioEng.unlock();
    state.skippedUpload = true;
    setStep(2);
    showToast("已略過上傳，可直接開始");
  });
  const spinBtns = ["btn-spin", "btn-knob", "btn-spin-step"].map($).filter(Boolean);
  spinBtns.forEach(el => el.addEventListener("click", () => { AudioEng.unlock(); triggerSpin(); }));

  if (IS_CANVAS) {
    $("btn-upload").addEventListener("click", () => $("file-input").click());
    $("file-input").addEventListener("change", handleImageUpload);
    $("btn-remove-photo").addEventListener("click", removeUploadedImage);
    $("preview-image").addEventListener("click", () => {
      if ($("preview-image").src) openLightbox($("preview-image").src, state.currentSentence);
    });
  }

  $("lightbox").addEventListener("click", (e) => {
    if (e.target.id === "lightbox" || e.target.id === "lightbox-close") closeLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeLightbox(); closeAdmin(); }
  });

  $("project-select").addEventListener("change", (e) => switchProject(e.target.value));
  $("btn-new-project").addEventListener("click", createProject);
  $("btn-rename-project").addEventListener("click", renameProject);
  $("btn-delete-project").addEventListener("click", deleteProject);
  $("btn-export").addEventListener("click", exportProject);
  $("btn-import").addEventListener("click", () => $("import-file").click());
  $("import-file").addEventListener("change", (e) => importProjectFile(e.target.files[0]));
  $("btn-reset-banks").addEventListener("click", resetDefaultBanks);
  document.querySelectorAll(".tabs button").forEach(b => {
    b.addEventListener("click", () => {
      state.adminTab = b.getAttribute("data-tab");
      cancelEdit();
      renderEntryList();
    });
  });
  $("btn-save-entry").addEventListener("click", saveEntry);
  $("btn-cancel-entry").addEventListener("click", cancelEdit);

  const fsBtn = $("btn-fs");
  if (fsBtn) {
    fsBtn.addEventListener("click", () => {
      const target = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (target.requestFullscreen) target.requestFullscreen().catch(() => showToast("請點擊右上角瀏覽器選單開啟全螢幕"));
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });
  }

  const muteBtn = $("btn-mute");
  if (muteBtn) {
    muteBtn.addEventListener("click", async () => {
      await AudioEng.unlock();
      AudioEng.toggleMute();
      showToast(AudioEng.muted ? "已關閉聲音" : "已開啟聲音");
    });
  }

  document.addEventListener("pointerdown", () => { AudioEng.unlock(); }, { once: true });
}

function boot() {
  if (window.fitCabinetToViewport) window.fitCabinetToViewport();
  loadStore();
  bindUI();
  initReels();
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => {
      if (state.isSpinning) return;
      const h = measureItemH();
      if (Math.abs(h - ITEM_H) >= 1) initReels();
    });
    const vp = $("viewport-outfit");
    if (vp) ro.observe(vp);
  }
  if (IS_CANVAS) {
    renderHistory();
    setStep(1);
  } else {
    setStep(1);
    syncHistoryWall(false);
  }
  showLcd(false);
  AudioEng.setMuted(false);
  maybeOpenAdminFromUrl();
}

document.addEventListener("DOMContentLoaded", boot);

  </script>
  <script>
    if (/[?&]debug=1/.test(location.search)) document.body.classList.add("debug");
  </script>
</body>
</html>
