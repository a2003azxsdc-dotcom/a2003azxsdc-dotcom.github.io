<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12110f">
  <title>風格參考牆</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>風格參考牆</h1>
        <p class="sub">點一下圖片，才展開筆記。</p>
      </div>
      <a class="nav-link" href="admin.html">管理</a>
    </header>
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <input class="search" id="search" type="search" placeholder="搜尋標題、標籤或描述" enterkeyhint="search" autocomplete="off">
    </div>
    <p class="note" id="note" hidden></p>
    <div class="wall" id="grid"></div>
  </div>
  <div class="modal" id="modal" hidden></div>
  <noscript><p class="noscript">需要開啟 JavaScript 才能看這面牆。</p></noscript>
  <script type="module" src="js/wall.js"></script>
</body>
</html>
